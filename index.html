<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Myra Securities – Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --ok: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 16px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .meta { font-size: 13px; color: var(--text-dim); }
  #login-btn {
    background: var(--accent); color: #0f172a; border: none;
    padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  section { margin-bottom: 32px; }
  section h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .card p { margin: 0; line-height: 1.6; font-size: 14px; }
  .card .updated { color: var(--text-dim); font-size: 12px; margin-top: 10px; }

  /* Org chart */
  #orgchart { overflow-x: auto; padding: 8px 0; }
  .org-level { display: flex; gap: 20px; margin-bottom: 20px; position: relative; }
  .org-node {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 14px; min-width: 150px;
  }
  .org-node .name { font-weight: 600; font-size: 13px; }
  .org-node .role { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .org-children { margin-left: 24px; border-left: 1px dashed var(--panel-border); padding-left: 20px; }

  /* KPI table */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--panel-border);
  }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
  }
  .status-offen { background: rgba(251,191,36,0.15); color: var(--warn); }
  .status-erreicht { background: rgba(74,222,128,0.15); color: var(--ok); }

  #load-state { color: var(--text-dim); font-size: 13px; }
  .placeholder-note {
    color: var(--text-dim); font-size: 13px; font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>Myra Securities — Dashboard</h1>
  <div>
    <span class="meta" id="user-info">Nicht angemeldet</span>
    <button id="login-btn">Anmelden</button>
  </div>
</header>

<p id="load-state">Wird geladen …</p>

<section>
  <h2>Org Chart</h2>
  <div class="card">
    <div id="orgchart"></div>
  </div>
</section>

<section>
  <h2>Größte HR-Probleme</h2>
  <div class="card">
    <p id="hr-summary">–</p>
    <div class="updated" id="hr-updated"></div>
  </div>
</section>

<section>
  <h2>Größte Myra-Probleme</h2>
  <div class="card">
    <p id="myra-summary">–</p>
    <div class="updated" id="myra-updated"></div>
  </div>
</section>

<section>
  <h2>HR-KPIs</h2>
  <div class="card">
    <table id="kpi-table">
      <thead>
        <tr><th>KPI</th><th>Definition</th><th>Zielwert</th><th>Aktuell</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="5" class="placeholder-note">Noch keine KPI-Werte — folgt, sobald Systemzugriff besteht</td></tr>
      </tbody>
    </table>
  </div>
</section>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
